global:
  scrape_interval: 15s
  external_labels:
    cluster: local
alerting:
  alertmanagers:
  - static_configs:
    - targets:
      - alertmanager:9093
rule_files:
- /etc/prometheus/rules.yml
scrape_configs:
- job_name: boutique
  metrics_path: /metrics
  static_configs:
  - targets:
    - frontend:8080
    labels:
      service: frontend
      environment: dev
      cluster: local
  - targets:
    - catalogue:8081
    labels:
      service: catalogue
      environment: dev
      cluster: local
  - targets:
    - cart:8082
    labels:
      service: cart
      environment: dev
      cluster: local
- job_name: orders
  metrics_path: /actuator/prometheus
  static_configs:
  - targets:
    - orders:8083
    labels:
      service: orders
      environment: dev
      cluster: local
- job_name: prometheus
  static_configs:
  - targets:
    - localhost:9090
- job_name: alertmanager
  static_configs:
  - targets:
    - alertmanager:9093
- job_name: incident-bridge
  static_configs:
  - targets:
    - incident-bridge:8084
